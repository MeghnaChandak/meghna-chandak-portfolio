<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meghna C. — Portfolio</title>

    <!-- Plain SEO: what a search engine shows in results. -->
    <meta name="description" content="Meghna C. — Python developer building backend systems with FastAPI, React, and MySQL." />

    <!-- Open Graph: what shows up when this link is pasted into Slack, LinkedIn,
         WhatsApp, etc. Without these, a shared link just shows a bare URL -
         easy to miss, and most recruiters skim fast. TODO once deployed: add
         og:image pointing at a real 1200x630 preview image in /public. -->
    <meta property="og:title" content="Meghna C. — Portfolio" />
    <meta property="og:description" content="Python developer building backend systems with FastAPI, React, and MySQL." />
    <meta property="og:type" content="website" />
    <!-- TODO: set this to your real deployed URL once you have one -->
    <meta property="og:url" content="https://TODO.example.com" />

    <meta name="theme-color" content="#0A0A0C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
